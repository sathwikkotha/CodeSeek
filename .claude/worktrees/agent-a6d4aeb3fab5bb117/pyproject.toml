[project]
name = "codeseek"
version = "0.1.0"
description = "Semantic code search over real repositories (AST-aware chunking + dual embedding evaluation)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tiktoken>=0.6",
    "pandas>=2.0",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: downloads/runs a real model or hits a real service; excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
