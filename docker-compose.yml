services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      # Cloned repos persist across container restarts -- re-ingesting the
      # same repo after a `docker compose restart` shouldn't require re-cloning.
      - repos_data:/app/data/repos

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - CODESEEK_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  qdrant_data:
  repos_data:
