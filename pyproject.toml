[project]
name = "codeseek"
version = "0.1.0"
description = "Semantic code search over real repositories: AST-aware chunking, hybrid retrieval, and a citation-verified LLM agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tiktoken>=0.6",
    "pandas>=2.0",
    "altair>=5.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: downloads/runs a real model or hits a real service; excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline SVG/HTML markup strings genuinely don't wrap sanely at 120 chars.
"streamlit_app/app.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
